name: Deploy Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assemble Space files
        shell: bash
        run: bash .github/scripts/assemble-huggingface-spaces.sh

      - name: Install Hugging Face uploader
        run: python -m pip install --upgrade huggingface_hub hf_xet

      - name: Upload full Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          hf upload stellamo/bundestag_stats .space-deploy .
          --repo-type space
          --delete "*"
          --commit-message "Deploy from GitHub ${{ github.sha }}"

      - name: Create embed Space if needed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: python
        run: |
          from huggingface_hub import HfApi

          HfApi().create_repo(
              repo_id="stellamo/bundestag_stats_embed",
              repo_type="space",
              space_sdk="gradio",
              exist_ok=True,
          )

      - name: Upload embed Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          hf upload stellamo/bundestag_stats_embed .space-embed-deploy .
          --repo-type space
          --delete "*"
          --commit-message "Deploy embed from GitHub ${{ github.sha }}"
