<!DOCTYPE html>
<html lang="en">
<head>

    <title>ChatGPT Clone</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div class="side-bar">
        <button id="new-chat">New chat</button>

        <footer>
            <p>&copy; 2024 Your Company</p>
        </footer>
    </div>
    <div class="main">

            <button id="predictButton">Predict Interruption</button>
            <div id="submit">➢</div>
        </div>
        <div class="bottom-section">

            <button id="fineTuneButton" style="font-size: 20px">Fine-tune Model</button>
        </div>

</html>
